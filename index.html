  --blue:#1d4fd8; --blue-soft:#dfe7fb;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#171c25; --sunk:#202734; --line:#2c3442;
  --fg:#e8ecf3; --muted:#97a1b2;
  --blue:#6f95ff; --blue-soft:#1c2a4d; --yellow:#f0b730; --yellow-soft:#3a2f12;

:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171c25; --sunk:#202734; --line:#2c3442;
  --fg:#e8ecf3; --muted:#97a1b2;
  --blue:#6f95ff; --blue-soft:#1c2a4d; --yellow:#f0b730; --yellow-soft:#3a2f12;
  --green:#45c483; --green-soft:#16362a; --red:#ff6b77; --red-soft:#43191e; --prop:#4b5567; color-scheme:dark}
*{box-sizing:border-box}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.status{font-size:12px;color:var(--muted)}
.datebar{display:flex;align-items:center;gap:8px}
.datebar .lbl{flex:1;min-width:0;text-align:center;font-family:var(--display);font-size:20px;font-weight:600}
.datebar .lbl small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:40px;font-size:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-size:24px;font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--display);font-size:18px;font-weight:600;margin:0;letter-spacing:.02em}
.meta{display:flex;flex-wrap:wrap;gap:6px}

.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.yellow{background:var(--yellow-soft);color:var(--yellow)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}

.exhead .nm{flex:1;min-width:0}

.exhead .nm span{font-size:13px;color:var(--muted)}
.last{font-size:12px;color:var(--blue);font-variant-numeric:tabular-nums}
.tick{appearance:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;margin:0}
.tick:checked{background:var(--green);border-color:var(--green)}
.tick:checked::after{content:"";width:9px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}

.set input{width:100%;min-width:0}
input[type=number],input[type=text],input[type=date],select,textarea{font:inherit;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.set input{border-color:transparent;text-align:center;padding:4px 2px}
.set .x{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%}
.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:var(--yellow);transition:width .3s}
.bar.p span{background:var(--blue)}
.bar.over span{background:var(--red)}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:15px;color:var(--muted);font-weight:500}
.meal{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.meal .nm{flex:1;min-width:0}

.meal .nm span{display:block;font-size:13px;color:var(--muted)}
.meal .kc{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vg{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:11px;font-weight:600;padding:2px 8px;margin-top:4px}
.vg.v{color:var(--green);border-color:var(--green)}
.vg.n{color:var(--red);border-color:var(--red)}
.water{display:flex;flex-wrap:wrap;gap:6px}
.drop{width:32px;height:38px;border:1.5px solid var(--blue);border-radius:6px 6px 10px 10px;background:transparent;padding:0}
.drop.on{background:var(--blue)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.qb{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px}
.extra{display:flex;gap:8px;align-items:center;font-size:14px}
.extra span{flex:1;min-width:0}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;padding:0 6px}
.btn{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600}
.circ{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.circ .rounds{display:flex;gap:6px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}

.note{font-size:13px;color:var(--muted)}

.thumb[aria-expanded="true"]{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.howto{border:0;background:transparent;color:var(--blue);font-weight:600;font-size:13px;padding:2px 0;margin-top:2px}
.guide{background:var(--sunk);border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:14px}

.frames{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.frames figure{margin:0;display:flex;flex-direction:column;gap:2px}
.frames svg{width:100%;height:auto;display:block;background:var(--surface);border-radius:8px}
.frames figcaption{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}

.gtext{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:14px}

@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>

async function connect(){
  if(!window.claude||!window.claude.use){setStatus("Saved on this device");return}
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid){setStatus("Saved on this device");return}
    S.coll=db.collection("data/users/"+uid);S.mode="cloud";setStatus("Syncing…");
    let first=true;
    S.coll.onSnapshot(snap=>{
      let touched=false;
      snap.docs.forEach(doc=>{
        const data=doc.data();if(!data)return;
        if(doc.id==="profile"){if(!profileDirty){S.profile={...DEFAULT_PROFILE,...data,v:data.v||0};if(migrate(S.profile))saveProfile();touched=true}}
        else if(doc.id.startsWith("day-")){const d=doc.id.slice(4);if(!dirty[d]){const c=JSON.parse(JSON.stringify(data));delete c.date;delete c.updated;S.days[d]={...blank(),...c};touched=true}}
      });

        first=false;
        const cloudDays=new Set(snap.docs.map(x=>x.id));
        const local=Object.keys(S.days).filter(d=>!cloudDays.has("day-"+d));
        local.forEach(d=>{dirty[d]=true;flush(d)});
        if(!cloudDays.has("profile"))saveProfile();
        setStatus("Synced");writeLocal();render();return;
      }
      writeLocal();
      const a=document.activeElement;
      if(touched&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();
    },e=>{setStatus("Sync stopped — changes stay on this device");S.mode="local"});

      h+=`<div class="circ"><div><b>Circuit ${c}</b><div class="note">${moves.map(m=>esc(MOVES[m])).join(" → ")}</div></div><div class="rounds">`;
      for(let i=0;i<rounds;i++)h+=`<label>R${i+1}<input type="checkbox" class="tick" data-f="circ" data-k="${c}" data-i="${i}" ${r[i]?"checked":""} aria-label="Circuit ${c} round ${i+1}"></label>`;
      h+=`</div></div><div class="mvlist">`;
      moves.forEach(m=>{const ex={k:m,n:MOVES[m]},op=S.open.has(m);
        h+=`<div class="mv"><div class="exhead"><button class="thumb" data-f="guide" data-k="${m}" aria-expanded="${op}" aria-controls="g-${m}" aria-label="How to do ${esc(ex.n)}">${figSVG(m,0,"",true,ex.n)}</button><div class="nm"><b>${esc(ex.n)}</b><span>${b===2?"45 s":"40 s"}${HOLDS.has(m)?" hold":" work"}</span><button class="howto" data-f="guide" data-k="${m}" aria-expanded="${op}" aria-controls="g-${m}">${op?"Hide guide ▴":"How to do it ▾"}</button></div></div>${guideHTML(ex)}</div>`});
      h+=`</div>`});
  }
  if(sess.cardio){h+=`<div class="ex"><div class="exhead"><div class="nm"><b>Cardio · ${sess.cardio} min</b><span>${esc(CARDIO[wd][b])}</span></div></div></div>`}
  h+=`<div class="row"><div class="field"><label for="cardio">Cardio done (min)</label><input id="cardio" type="number" inputmode="numeric" data-f="cardio" value="${esc(doc.cardio)}"></div>
  <div class="field"><label for="steps">Steps (target ${B.steps.toLocaleString("en-IN")})</label><input id="steps" type="number" inputmode="numeric" data-f="steps" value="${esc(doc.steps)}"></div></div></section>`;
  h+=healthHTML(d,doc,B);

  /* Diet */
  h+=`<section class="card"><div class="eyebrow">Diet</div><div class="totals">
   <div><div class="big" id="kc">0 <small>/ ${B.kcal} kcal</small></div><div class="bar" id="kcb"><span></span></div></div>
   <div><div class="big" id="pr">0 <small>/ ${B.prot} g protein</small></div><div class="bar p" id="prb"><span></span></div></div></div>
   <div class="note" id="dietNote"></div>`;
  MEALS.forEach(m=>{const veg=m.v&&isVeg(doc,m),o=veg?m.v:m.nv;
    h+=`<div class="meal"><input type="checkbox" class="tick" id="m-${m.k}" data-f="meal" data-k="${m.k}" ${doc.meals[m.k]?"checked":""} aria-label="Ate ${esc(m.n)}">
    <div class="nm"><b>${esc(m.n)}</b> <span>${esc(m.t)} · ${esc(o[0])}</span>${m.v?`<button class="vg ${veg?"v":"n"}" data-f="veg" data-k="${m.k}">${veg?"Veg":"Non-veg"} ⇄</button>`:""}</div>
    <div class="kc">${o[1]} kcal<br>${o[2]} g</div></div>`});
  h+=`<div><h3>Extra food</h3><div class="note">Tap to add anything outside the plan.</div></div><div class="quick">`;
  QUICK.forEach((q,i)=>h+=`<button class="qb" data-f="quick" data-i="${i}">+ ${esc(q[0])}</button>`);
  h+=`</div><div id="extras" style="display:flex;flex-direction:column;gap:6px">`;
  (doc.extras||[]).forEach((x,i)=>h+=`<div class="extra"><span>${esc(x.name)}</span><span class="note" style="flex:none">${+x.kcal||0} kcal · ${+x.p||0} g</span><button class="del" data-f="delx" data-i="${i}" aria-label="Remove ${esc(x.name)}">×</button></div>`);
  h+=`</div><div class="row"><input id="xn" type="text" placeholder="Food" style="flex:2;min-width:120px"><input id="xk" type="number" inputmode="numeric" placeholder="kcal" style="flex:1;min-width:64px"><input id="xp" type="number" inputmode="numeric" placeholder="protein g" style="flex:1;min-width:64px"><button class="btn" data-f="addx">Add</button></div>
  <div><h3>Water <span class="note" id="wl"></span></h3></div><div class="water">`;
  for(let i=1;i<=14;i++)h+=`<button class="drop ${doc.water>=i?"on":""}" data-f="water" data-i="${i}" aria-label="${i*250} ml"></button>`;
  h+=`</div></section>`;

  /* Body */
  h+=`<section class="card"><div class="eyebrow">Body & recovery</div><div class="row">
   <div class="field"><label for="weight">Weight (kg, on waking)</label><input id="weight" type="number" inputmode="decimal" step="0.1" data-f="weight" value="${esc(doc.weight)}"></div>
   <div class="field"><label for="waist">Waist at navel (cm)</label><input id="waist" type="number" inputmode="decimal" step="0.5" data-f="waist" value="${esc(doc.waist)}"></div>
   <div class="field"><label for="sleep">Sleep (h)</label><input id="sleep" type="number" inputmode="decimal" step="0.5" data-f="sleep" value="${esc(doc.sleep)}"></div></div>
   <div class="field"><label for="notes">Notes</label><textarea id="notes" rows="2" data-f="notes" placeholder="Energy, soreness, anything missed">${esc(doc.notes)}</textarea></div></section>`;
  return h;
}
function updateDerived(){
  const d=S.date,doc=day(d),B=BLOCKS[blockOf(weekOf(d))],t=diet(doc);
  const kc=document.getElementById("kc");if(!kc)return;
  kc.innerHTML=t.k+` <small>/ ${B.kcal} kcal</small>`;
  document.getElementById("pr").innerHTML=t.p+` <small>/ ${B.prot} g protein</small>`;
  const kb=document.getElementById("kcb");kb.querySelector("span").style.width=Math.min(100,t.k/B.kcal*100)+"%";kb.classList.toggle("over",t.k>B.kcal+50);
  document.getElementById("prb").querySelector("span").style.width=Math.min(100,t.p/B.prot*100)+"%";
  const left=B.kcal-t.k;
  document.getElementById("dietNote").textContent=t.k===0?"Tick meals as you eat them.":left>=0?left+" kcal left · "+Math.max(0,B.prot-t.p)+" g protein to go":"Over by "+(-left)+" kcal today";
  document.getElementById("wl").textContent=((doc.water||0)*0.25).toFixed(2).replace(/0$/,"")+" / 3.5 L";
}

function progHTML(){
  const P=S.profile,ds=Object.keys(S.days).sort();
  const weights=ds.map(d=>[d,num(S.days[d].weight)]).filter(x=>x[1]!==null);
  const lastW=weights.length?weights[weights.length-1][1]:null;
  const recent=weights.filter(x=>diffDays(x[0],TODAY)<7&&diffDays(x[0],TODAY)>=0);
  const avg7=recent.length?(recent.reduce((a,x)=>a+x[1],0)/recent.length):null;
  const cur=avg7??lastW;
  const lost=cur!==null?(P.startWeight-cur):null;
  const toGo=cur!==null?(cur-P.goalWeight):(P.startWeight-P.goalWeight);
  const daysLeft=diffDays(TODAY,P.goalDate);
  // this week
  const wkStart=addDays(TODAY,-((parse(TODAY).getDay()+6)%7));
  let sess=0,planned=6,kSum=0,pSum=0,dn=0;
  for(let i=0;i<7;i++){const d=addDays(wkStart,i);if(d>TODAY)break;const doc=S.days[d];if(!doc)continue;const wd=parse(d).getDay();if(wd!==0&&trained(doc,wd))sess++;const t=diet(doc);if(t.k>0){kSum+=t.k;pSum+=t.p;dn++}}
  // streak
  let streak=0;for(let i=0;i<120;i++){const d=addDays(TODAY,-i);const doc=S.days[d];const wd=parse(d).getDay();if(wd===0){if(i===0)continue;continue}if(doc&&trained(doc,wd))streak++;else if(i===0)continue;else break}
  let h=`<section class="card"><div class="eyebrow">Goal</div><h2>${P.startWeight} → ${P.goalWeight} kg by ${esc(fmt(P.goalDate))}</h2>
  <div class="stats">
   <div class="stat"><div class="eyebrow">Current (7-day avg)</div><div class="big">${cur!==null?cur.toFixed(1):"—"} <small>kg</small></div></div>
   <div class="stat"><div class="eyebrow">Lost so far</div><div class="big">${lost!==null?lost.toFixed(1):"0.0"} <small>kg</small></div></div>
   <div class="stat"><div class="eyebrow">To goal</div><div class="big">${toGo.toFixed(1)} <small>kg</small></div></div>
   <div class="stat"><div class="eyebrow">Days left</div><div class="big">${daysLeft>=0?daysLeft:0}</div></div>
  </div>${chartSVG(weights)}<div class="note">Dashed line: steady path from start to goal. Log your weight daily on waking; judge the weekly average.</div></section>`;
  h+=`<section class="card"><div class="eyebrow">This week</div><div class="stats">
   <div class="stat"><div class="eyebrow">Sessions</div><div class="big">${sess} <small>/ ${planned}</small></div></div>
   <div class="stat"><div class="eyebrow">Training streak</div><div class="big">${streak} <small>days</small></div></div>
   <div class="stat"><div class="eyebrow">Avg calories</div><div class="big">${dn?Math.round(kSum/dn):"—"} <small>kcal</small></div></div>
   <div class="stat"><div class="eyebrow">Avg protein</div><div class="big">${dn?Math.round(pSum/dn):"—"} <small>g</small></div></div>
  </div>${weekHealth(wkStart)}</section>`;
  h+=`<section class="card"><div class="eyebrow">History</div>`;
  const rows=ds.slice().reverse().filter(d=>{const x=S.days[d];return x&&(Object.keys(x.done||{}).length||Object.keys(x.meals||{}).length||x.weight||x.cardio||x.steps||(x.extras||[]).length)});
  if(!rows.length)h+=`<div class="note">No days logged yet. Open Today, tick a meal or log a set, and it appears here.</div>`;
  else{h+=`<div class="hist"><table><thead><tr><th>Date</th><th>Session</th><th>Trained</th><th>kcal</th><th>Protein</th><th>Steps</th><th>Weight</th></tr></thead><tbody>`;
    rows.slice(0,60).forEach(d=>{const x=S.days[d],wd=parse(d).getDay(),t=diet(x);
      h+=`<tr><td><button data-f="goto" data-d="${d}">${esc(fmt(d))}</button></td><td>${esc(WEEK[wd].name)}</td><td>${trained(x,wd)?'<span class="chip green">Yes</span>':'<span class="chip">—</span>'}</td><td>${t.k||"—"}</td><td>${t.p?t.p+" g":"—"}</td><td>${num(x.steps)!==null?Math.round(num(x.steps)).toLocaleString("en-IN"):"—"}</td><td>${num(x.weight)!==null?num(x.weight).toFixed(1):"—"}</td></tr>`});
    h+=`</tbody></table></div>`}
  h+=`</section><section class="card"><details><summary>Settings</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
   <div class="row"><div class="field"><label for="ps">Plan start date</label><input id="ps" type="date" data-f="prof" data-k="startDate" value="${esc(P.startDate)}"></div>
   <div class="field"><label for="pw">Start weight (kg)</label><input id="pw" type="number" step="0.1" data-f="prof" data-k="startWeight" value="${esc(P.startWeight)}"></div></div>
   <div class="row"><div class="field"><label for="gw">Goal weight (kg)</label><input id="gw" type="number" step="0.1" data-f="prof" data-k="goalWeight" value="${esc(P.goalWeight)}"></div>
   <div class="field"><label for="gd">Goal date</label><input id="gd" type="date" data-f="prof" data-k="goalDate" value="${esc(P.goalDate)}"></div></div>
   <div class="field"><label for="dv">Default diet</label><select id="dv" data-f="prof" data-k="veg"><option value="0" ${P.veg?"":"selected"}>Non-veg</option><option value="1" ${P.veg?"selected":""}>Veg</option></select></div>
   <div class="note">${S.mode==="cloud"?"Your log is saved to your account and syncs across your devices. Only you can see it.":"Your log is saved on this device only. Copy a backup now and then."}</div></div></details></section>
  <section class="card"><details><summary>Health Connect</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">${NATIVE?(HC.status!=="ok"?`<div class="note">${HC.status==="update"?"Health Connect needs an update.":"Health Connect isn't installed."}</div><div class="row"><button class="btn" data-f="hcconnect">${HC.status==="update"?"Update":"Install"} Health Connect</button></div>`:`<div class="note">${HC.granted?`Reading ${HC.granted} of ${HC.total} data types. Steps, weight and sleep fill in automatically unless you type your own value.`:"Not connected yet."}</div><div class="row"><button class="btn" data-f="hcconnect">${HC.granted?"Change permissions":"Connect"}</button>${HC.granted?`<button class="btn ghost" data-f="hcsync30">Sync last 30 days</button><button class="btn ghost" data-f="hcmanage">Open Health Connect</button>`:""}</div><span class="note" id="hcmsg"></span>`):`<div class="note">In the Iron Log Android app, steps, heart rate, HRV, sleep and more fill in automatically from Google Health Connect.</div>`}</div></details></section>
  <section class="card"><details${NATIVE&&!photoCount()?" open":""}><summary>Exercise photos</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">${NATIVE?`<div class="note">Download GuruMann's photos for every exercise once (needs internet, about 2–5 MB). After that, each exercise guide shows them offline.</div><div class="row"><button class="btn" data-f="photos">${photoCount()?"Download again":"Download photos"}</button><span class="note" id="phmsg">${photoCount()?photoCount()+" photos saved on this phone.":""}</span></div>`:`<div class="note">In the Iron Log Android app you can download GuruMann's photos once and see them offline in every guide. Here, use the photo link in each guide.</div>`}</div></details></section>
  <section class="card"><details><summary>Backup &amp; restore</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
   <div class="field"><label for="bk">Your backup</label><textarea id="bk" rows="3" readonly>${esc(JSON.stringify({app:"ironlog",v:1,profile:S.profile,days:S.days}))}</textarea></div>
   <div class="row"><button class="btn" data-f="copybk">Copy backup</button><span class="note" id="bkmsg">Paste it into a note or message to keep it safe, or into Iron Log on another device.</span></div>
   <div class="field"><label for="rs">Restore from a backup</label><textarea id="rs" rows="3" placeholder="Paste a backup here"></textarea></div>
   <div class="row"><button class="btn" data-f="restore">Restore</button><span class="note" id="rsmsg">Adds the backup's days to this log. Days logged in both places take the backup's version.</span></div></div></details></section>`;
  return h;
}
function weekHealth(wkStart){
  const acc={steps:[],hrRest:[],hrv:[],sleepH:[]};
  for(let i=0;i<7;i++){const d=addDays(wkStart,i);if(d>TODAY)break;const x=S.days[d],h=x&&x.health;if(!h)continue;for(const k in acc)if(h[k]!=null)acc[k].push(+h[k])}
  if(!Object.values(acc).some(a=>a.length))return "";
  const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
  const st=(lbl,v,u,f)=>`<div class="stat"><div class="eyebrow">${lbl}</div><div class="big">${v===null?"—":f(v)} <small>${u}</small></div></div>`;
  return `<div class="eyebrow" style="margin-top:4px">Health averages</div><div class="stats">${st("Steps / day",avg(acc.steps),"",v=>Math.round(v).toLocaleString("en-IN"))}${st("Resting HR",avg(acc.hrRest),"bpm",v=>Math.round(v))}${st("HRV",avg(acc.hrv),"ms",v=>Math.round(v))}${st("Sleep",avg(acc.sleepH),"h",v=>v.toFixed(1))}</div>`;
}
function chartSVG(weights){
  const P=S.profile,W=600,H=230,L=40,R=12,T=14,Bm=28;
  const x0=P.startDate,lastD=weights.length?weights[weights.length-1][0]:TODAY;
  const x1=[P.goalDate,lastD,addDays(x0,14)].sort().pop();
  const span=Math.max(1,diffDays(x0,x1));
  const vals=weights.map(w=>w[1]).concat([P.startWeight,P.goalWeight]);
  let lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
  const X=d=>L+(W-L-R)*Math.max(0,Math.min(1,diffDays(x0,d)/span)),Y=v=>T+(H-T-Bm)*(hi-v)/(hi-lo);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart">`;
  const step=(hi-lo)>8?2:1;
  for(let v=lo;v<=hi;v+=step){s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`}
  [x0,P.goalDate].forEach((d,i)=>s+=`<text x="${X(d)}" y="${H-8}" text-anchor="${i?"end":"start"}" font-size="11" fill="var(--muted)">${esc(fmt(d))}</text>`);
  s+=`<line x1="${X(x0)}" y1="${Y(P.startWeight)}" x2="${X(P.goalDate)}" y2="${Y(P.goalWeight)}" stroke="var(--yellow)" stroke-width="2" stroke-dasharray="6 5"/>`;
  s+=`<circle cx="${X(P.goalDate)}" cy="${Y(P.goalWeight)}" r="4" fill="var(--yellow)"/>`;
  if(weights.length){
    const pts=weights.map(w=>X(w[0])+","+Y(w[1])).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>`;
    weights.forEach((w,i)=>s+=`<circle cx="${X(w[0])}" cy="${Y(w[1])}" r="${i===weights.length-1?5:3}" fill="var(--blue)"/>`);
  }else s+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" fill="var(--muted)">Log your first weigh-in to start the line</text>`;
  return s+`</svg>`;
}

const main=document.getElementById("main");
main.addEventListener("input",e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;const d=S.date;
  if(f==="prof"){const k=t.dataset.k;S.profile[k]=k==="veg"?t.value==="1":(t.type==="number"?(num(t.value)??S.profile[k]):t.value);saveProfile();return}
  const doc=edit(d);
  if(f==="set"){const k=t.dataset.k,i=+t.dataset.i;doc.sets[k]=doc.sets[k]||[];while(doc.sets[k].length<=i)doc.sets[k].push({});doc.sets[k][i][t.dataset.p]=t.value;
    const ex=Object.values(WEEK).flatMap(w=>w.ex).find(x=>x.k===k),n=plannedSets(ex,blockOf(weekOf(d)));
    const full=doc.sets[k].slice(0,n).filter(s=>s&&s.r).length>=n;if(full&&!doc.done[k]){doc.done[k]=true;const c=main.querySelector(`[data-f="done"][data-k="${k}"]`);if(c)c.checked=true}}
  else if(["cardio","steps","weight","waist","sleep","notes"].includes(f)){doc[f]=t.value;if(f==="steps"||f==="weight"||f==="sleep")doc[f+"Auto"]=false}
  else return;
  save(d);updateDerived();
});
main.addEventListener("change",e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;const d=S.date,doc=edit(d);
  if(f==="done"){doc.done[t.dataset.k]=t.checked}
  else if(f==="circ"){const k=t.dataset.k;doc.circ[k]=doc.circ[k]||[];doc.circ[k][+t.dataset.i]=t.checked}
  else if(f==="meal"){doc.meals[t.dataset.k]=t.checked}
  else if(f==="prof"&&t.tagName==="SELECT"){S.profile.veg=t.value==="1";saveProfile();return}
  else return;
  save(d);updateDerived();
});
main.addEventListener("click",e=>{
  const t=e.target.closest("[data-f]");if(!t||t.tagName==="INPUT")return;const f=t.dataset.f,d=S.date;

    ds.forEach(d=>{S.days[d]={...blank(),...j.days[d]};save(d)});

    return}
  if(f==="guide"){const k=t.dataset.k,g=document.getElementById("g-"+k);if(!g)return;
    const open=!S.open.has(k);open?S.open.add(k):S.open.delete(k);g.hidden=!open;
    main.querySelectorAll(`[data-f="guide"][data-k="${k}"]`).forEach(b=>{b.setAttribute("aria-expanded",open);if(b.classList.contains("howto"))b.textContent=open?"Hide guide ▴":"How to do it ▾"});
    return}
  const doc=edit(d);
  if(f==="veg"){const m=MEALS.find(x=>x.k===t.dataset.k);doc.vegm[m.k]=!isVeg(doc,m);save(d);render();return}
  if(f==="water"){const i=+t.dataset.i;doc.water=doc.water===i?i-1:i;main.querySelectorAll(".drop").forEach((b,j)=>b.classList.toggle("on",j<doc.water));save(d);updateDerived();return}
  if(f==="quick"){const q=QUICK[+t.dataset.i];doc.extras.push({name:q[0],kcal:q[1],p:q[2]});save(d);render();return}
  if(f==="delx"){doc.extras.splice(+t.dataset.i,1);save(d);render();return}
  if(f==="addx"){const n=document.getElementById("xn").value.trim();const k=num(document.getElementById("xk").value);if(!n||k===null){document.getElementById("xn").focus();return}
    doc.extras.push({name:n,kcal:k,p:num(document.getElementById("xp").value)||0});save(d);render();return}
});
